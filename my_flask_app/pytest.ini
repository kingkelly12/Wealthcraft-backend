[pytest]
# Automated, offline suite only. scripts/ holds manual checks that need a live
# server or real credentials, so it is never collected.
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    # Third-party deprecation noise (pydantic v1-style Config, etc.)
    ignore::DeprecationWarning
    ignore:.*PydanticDeprecatedSince20.*
